[project]
name = "stamp"
version = "2.5.0"
authors = [
    { name = "Omar El Nahhas", email = "omar.el_nahhas@tu-dresden.de" },
    { name = "Marko van Treeck", email = "markovantreeck@gmail.com" },
    { name = "Georg Wölflein", email = "georgw7777@gmail.com" },
    { name = "Tim Lenz", email = "tim.lenz@tu-dresden.de" },
    { name = "Laura Žigutytė", email = "laura.zigutyte@tu-dresden.de" },
    { name = "Cornelius Kummer", email = "cornelius.kummer@tu-dresden.de" },
    { name = "Juan Pablo Ricapito", email = "juan_pablo.ricapito@tu-dresden.de" },
    { name = "Fabian Wolf", email = "fabian.wolf2@tu-dresden.de" },
    { name = "Minh Duc Nguyen", email = "minh_duc.nguyen1@tu-dresden.de" }
]
description = "A protocol for Solid Tumor Associative Modeling in Pathology"
readme = "README.md"
requires-python = ">=3.13,<3.15"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Everything is pinned exactly, here and below: a loose specifier lets a
# compromised release enter a fresh resolution. Enforced by
# scripts/check_dependency_config.py.
dependencies = [
    "beartype==0.22.9",
    "einops==0.8.2",
    "h5py==3.16.0",
    "jaxtyping==0.3.11",
    "lightning==2.6.5",
    "matplotlib==3.11.1",
    # Held back: numpy 2.5's unparametrised `npt.NDArray` is rejected by
    # beartype 0.22.9, and STAMP annotates with it throughout.
    "numpy==2.4.6",
    "opencv-python==5.0.0.93",
    "openpyxl==3.1.5",
    "openslide-bin==4.0.1.2",
    "openslide-python==1.4.6",
    "packaging==26.3",
    "pandas==2.3.3",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "torchmetrics==1.9.0",
    "tqdm==4.70.0",
    "timm==1.0.28",
    # Held back: transformers 5 reads `all_tied_weights_keys`, which the TITAN
    # and PRISM `trust_remote_code` models do not define. huggingface-hub
    # follows: transformers 4.57 requires `huggingface-hub<1.0`.
    "transformers==4.57.6",
    "lifelines==0.30.3",
    "huggingface-hub==0.36.2"
]

[project.optional-dependencies]
build = [
    "setuptools==81.0.0",
    "hatchling==1.32.0",
    "psutil==7.2.2",
    "ninja==1.11.1.1"
]
flash-attention = [
    "flash-attn==2.8.3.post1+cu.13.0.torch.2.11; sys_platform == 'linux'",
]
conch = [
    "huggingface-hub==0.36.2",
    "conch @ git+https://github.com/KatherLab/CONCH@e1bd7e6ad11e0a6c4e74591f9a982374f239aa9a",
]
conch1_5_cpu = [
    "einops-exts==0.0.4",
]
conch1_5 = [
    "stamp[conch1_5_cpu]",
    "stamp[flash-attention]; sys_platform == 'linux'",
]
ctranspath = [
    "gdown==6.1.0",
]
chief_ctranspath = [
    "gdown==6.1.0",
    "torch==2.11.0"
]
gigapath = [
    "stamp[flash-attention]; sys_platform == 'linux'",
    "gigapath @ git+https://github.com/KatherLab/prov-gigapath.git@ec97baa5f071319680132e18868279b4cca877cc ; sys_platform == 'linux'",
    "fvcore==0.1.5.post20221221; sys_platform == 'linux'",
    "iopath==0.1.10; sys_platform == 'linux'",
    "monai==1.6.0; sys_platform == 'linux'",
    "scikit-image==0.26.0; sys_platform == 'linux'",
    "webdataset==1.0.2; sys_platform == 'linux'",
    "scikit-survival==0.28.0; sys_platform == 'linux'",
    "fairscale==0.4.13; sys_platform == 'linux'",
    "wandb==0.28.1; sys_platform == 'linux'",
]
uni = [
    "huggingface-hub==0.36.2",
    "uni @ git+https://github.com/KatherLab/uni.git@f37c299eb0bffa0e585f120974082cfec6ee6d53",
]
virchow2 = [
    "huggingface-hub==0.36.2",
    "torch==2.11.0",
]
cobra = [
    "causal-conv1d==1.6.2.post1+cu.13.0.torch.2.11; sys_platform == 'linux'",
    "mamba-ssm==2.3.2.post1+cu.13.0.torch.2.11; sys_platform == 'linux'",
    "cobra @ git+https://github.com/KatherLab/COBRA.git@49d231191db5a9c2ea37a2398dd922c8c9ee9cdb ; sys_platform == 'linux'",
    "jinja2==3.1.6; sys_platform == 'linux'",
    # Matches the triton that torch 2.11 cu130 depends on.
    "triton==3.6.0; sys_platform == 'linux'",
]
prism_cpu = [
    "sacremoses==0.1.1",
    "environs==11.0.0",
]
prism = [
    "stamp[prism_cpu]",
]
madeleine = [
    "madeleine @ git+https://github.com/mahmoodlab/MADELEINE.git@de7c85acc2bdad352e6df8eee5694f8b6f288012"
]
musk_cpu = [
    "musk @ git+https://github.com/lilab-stanford/MUSK.git@e1699c27687f44bbf6d4adfcbb2abe89795d347f",
    "fairscale==0.4.13",
]
musk = [
    "stamp[musk_cpu]",
    "stamp[flash-attention]; sys_platform == 'linux'",
    # MUSK uses xformers' memory-efficient attention on GPUs with compute
    # capability <= 7, where it does not use flash-attn. Absent, it falls back
    # to plain attention. Only ships Linux x86_64 and Windows AMD64 wheels.
    "xformers==0.0.35; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
plip_cpu = [
    "transformers==4.57.6"
]
plip = [
    "stamp[plip_cpu]",
]
mcp = [
    "fastmcp==3.4.7",
]


# Blanket target
cpu = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "stamp[conch,ctranspath,uni,virchow2,chief_ctranspath,conch1_5_cpu,prism_cpu,madeleine,musk_cpu,plip_cpu]"
]
gpu = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "stamp[conch,ctranspath,uni,virchow2,chief_ctranspath,conch1_5_cpu,prism,madeleine,plip,musk_cpu,cobra]"
]
gpu_all = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "stamp[conch,ctranspath,uni,virchow2,chief_ctranspath,musk,gigapath,conch1_5,prism,madeleine,plip,cobra]"
]
# Deprecated alias of gpu_all, kept for one release. Removed in the next
# breaking release.
gpu_prebuilt = [
    "stamp[gpu_all]",
]
all = ["stamp[cpu]"]

[project.scripts]
"stamp" = "stamp.__main__:main"

[project.urls]
"Homepage" = "https://github.com/KatherLab/STAMP"
"Bug Tracker" = "https://github.com/KatherLab/STAMP/issues"

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# To allow referencing git repos in dependencies
allow-direct-references = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
lint.ignore = ["F722"] # https://docs.kidger.site/jaxtyping/faq/#flake8-or-ruff-are-throwing-an-error

[tool.uv]
required-version = ">=0.12,<0.13"
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
  [
    { extra = "cpu" },
    { extra = "gpu_all" },
  ],
  [
    { extra = "cpu" },
    { extra = "gpu_prebuilt" },
  ],
  [
    { extra = "gpu" },
    { extra = "gpu_all" },
  ],
  [
    { extra = "gpu" },
    { extra = "gpu_prebuilt" },
  ],
]
# COBRA lists torch in its `build-system.requires`, so uv resolves a torch for
# its build environment separately. Without this it takes the newest release on
# PyPI and drags in the whole cuda-toolkit chain.
build-constraint-dependencies = [
  "torch==2.11.0",
  "torchvision==0.26.0",
]

# Source builds run a setup.py that probes for nvcc, which fails on any machine
# without a CUDA toolkit. Refusing the build gives a clear resolution error.
no-build-package = [
  "flash-attn",
  "mamba-ssm",
  "causal-conv1d",
]

# The upstream forks declare their CUDA extras unconditionally, which drags
# CUDA-only packages onto macOS. flash-attn and the COBRA extensions are
# re-declared in the extras above with markers. UNI's xformers is dropped
# without replacement: UNI never imports it, and declaring it there put it
# into CPU installs, which must stay free of CUDA packages. It is declared
# under the musk extra instead, which does use it.
exclude-dependencies = [
  { package = { name = "uni" }, dependencies = ["xformers"] },
  { package = { name = "gigapath" }, dependencies = ["flash-attn"] },
  { package = { name = "cobra" }, dependencies = ["mamba-ssm", "causal-conv1d"] },
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "gpu" },
  { index = "pytorch-cu130", extra = "gpu_all" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "gpu" },
  { index = "pytorch-cu130", extra = "gpu_all" },
]
flash-attn = { index = "astral-cu130" }
mamba-ssm = { index = "astral-cu130" }
causal-conv1d = { index = "astral-cu130" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Pre-built flash-attn / mamba-ssm / causal-conv1d wheels. The local version
# identifies the CUDA and PyTorch build, e.g. `+cu.13.0.torch.2.11`.
[[tool.uv.index]]
name = "astral-cu130"
url = "https://wheels.astral.sh/simple/cu130/"
explicit = true
